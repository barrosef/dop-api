syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/timestamp.proto";

// The attention box at the EDGE — the SINGLE queue, across all the active
// account's demands, that answers "where am I needed, and in what order".
//
// It is not the chat: it is what leads to the right chat. Five demands with
// three threads each are fifteen conversations, and without this queue the
// multi-agent model drowns the dev — the two rise together or neither rises
// (the conversation-and-attention spec §3, risk R-2). Without the box at the
// edge, the cockpit has no way to draw it.
//
// The same discipline as identity.proto: identity does NOT travel in the body —
// it comes from the token in `authorization: Bearer <token>`, and the active
// account from the `x-account-id` metadata. There is no CallContext here.
//
// **What this contract deliberately does NOT offer: marking as read, or
// dismissing.** The box is a PROJECTION, not a system (ADR-0006): every item is
// born of an event and dies of another, and what closes an item is the FACT —
// the gate decided, the thread unblocked, the directive resolved. An item that
// disappears without the problem having been solved is a comfortable lie, and a
// box that lies becomes a box that is ignored, which is the spec's risk R-1.
// Passing on a "dismiss" here that the core does not have would be the edge
// inventing a state nothing backs.
//
// **Where the edge earns its keep:**
//
//   - the BADGE comes from `open_total`, which is the core's and counts the
//     WHOLE ACCOUNT. Counting `items` would give a number that changes when you
//     paginate — a badge that goes down because the dev opened the second page;
//   - the items come GROUPED by demand (`groups`), which is the grouping the
//     spec asks for. Each client doing its own grouping is how two screens end
//     up showing the same queue in different orders.
//
// And what the edge does NOT do: recompute priority. It is DERIVED by the core
// (the kind's impact, then age — internal/domain/attention/entity.go), and a
// second ruler here would make the queue stop having a single order, which is
// exactly what it exists to offer. `items` comes out in the order the core sent
// it, and the groups come out in the order of each one's most urgent item.

// The item's nature — and it is what determines its impact on the ordering.
// The same numbers and the same order as dop.v1.AttentionItem.Kind.
enum AttentionKind {
  ATTENTION_KIND_UNSPECIFIED = 0;
  // A thread blocked waiting for the human's answer (ADR-0010).
  ATTENTION_KIND_THREAD_BLOCKED = 1;
  // A stage stopped at a human gate — a spec awaiting approval.
  ATTENTION_KIND_GATE_PENDING = 2;
  // A PR awaiting review, with the evidence alongside (ADR-0007).
  ATTENTION_KIND_PR_REVIEW = 3;
  // A conflict the merge queue escalated to a human decision (ADR-0008).
  ATTENTION_KIND_MERGE_CONFLICT = 4;
  // A cross-cutting concern detected by the techlead, with options and a
  // recommendation (ADR-0015).
  ATTENTION_KIND_DIRECTIVE = 5;
  // A demand paused by a budget overrun (ADR-0011).
  ATTENTION_KIND_BUDGET_EXCEEDED = 6;
  // A broken account integration — the work stops until somebody reconnects it.
  ATTENTION_KIND_INTEGRATION_BROKEN = 7;
}

message AttentionItem {
  string        id   = 1;
  AttentionKind kind = 2;

  // Where clicking leads. `target_kind` says what it is (thread, stage,
  // pull_request, directive, demand, resource) and `target_id` says which one —
  // the cockpit resolves the route. Keeping the finished route here would tie
  // the backend to the screen's design.
  string target_kind = 3;
  string target_id   = 4;

  // The demand the item belongs to, when it belongs to one: it is what the box
  // groups by. EMPTY on an account item (a broken integration, for example).
  string demand_id = 5;

  string title   = 6;
  string summary = 7;

  // DERIVED by the core (the kind's impact, then age), never supplied by
  // whoever emits the event and never recomputed here. A lower number = more
  // urgent.
  int32 priority = 8;

  google.protobuf.Timestamp opened_at = 9;
  // Filled in when the fact that opened the item was resolved. Absent ≠ zeroed:
  // a zeroed Timestamp would say "resolved in 1970". A resolved item leaves the
  // box but stays in the projection — it is what tells how long the dev took to
  // answer.
  google.protobuf.Timestamp resolved_at = 10;
}

// ONE demand's items, in the order the core gave them.
//
// It exists because the spec asks for a box groupable by demand: fifteen
// conversations spread over a flat list do not say "demand 3 is waiting for you
// in three places". The grouping is done ONCE, here, and not in each client.
message AttentionGroup {
  // Empty = the ACCOUNT items, which belong to no demand. This group is a group
  // like the others, and not a leftover thrown at the end: a broken integration
  // affects the whole account and is usually the box's most urgent item.
  string demand_id = 1;
  repeated AttentionItem items = 2;
}

// The box as the screen needs it.
message AttentionBox {
  // The flat queue, in the core's order — the most urgent first.
  repeated AttentionItem items = 1;
  // The SAME items grouped by demand. The groups come out in the order of each
  // one's most urgent item, which is the order in which the first occurrence
  // appeared in the queue — no new ruler.
  repeated AttentionGroup groups = 2;
  // The BADGE: how many OPEN items the account has, independent of this page
  // and independent of the demand filter. It comes from the core. Counting
  // `items` would give a badge that changes when you paginate.
  int32 open_total = 3;
}

message ListAttentionRequest {
  // False (the default) = only the open ones, which is the box's case. The
  // resolved ones come in by explicit request, for history.
  bool include_resolved = 1;
  // An optional filter: ONE demand's box. It does not change `open_total`,
  // which stays the account's badge.
  string demand_id = 2;
  // 0 = the core's default. There is NO page_token: `dop.v1.AttentionService`
  // returns no page cursor, and announcing one here would be promising a
  // navigation the source cannot deliver. Whoever wants to know they are seeing
  // everything compares `open_total` with the size of `items`.
  int32 page_size = 3;
}

// What changed in the box — not the whole box.
//
// Resending the queue on every change would waste bandwidth and make the screen
// flicker.
enum AttentionChange {
  ATTENTION_CHANGE_UNSPECIFIED = 0;
  ATTENTION_CHANGE_OPENED   = 1;
  ATTENTION_CHANGE_RESOLVED = 2;
}

message AttentionUpdate {
  // `change` is the notice's TRUTH, not `item.resolved_at`. See below.
  AttentionChange change = 1;

  // On OPENED, the item comes whole.
  //
  // On RESOLVED, it comes PARTIAL, and on purpose: the core identifies what
  // closed by the TARGET (`kind` + `target_kind` + `target_id`), because
  // whoever closes it knows the target and not the projection's id. So `id`,
  // `title`, `summary` and `opened_at` arrive empty, and so does `resolved_at`
  // — the client matches the notice against the item it already holds, by the
  // target, and removes it. The edge passes that on as it is: inventing an id
  // here, or a `resolved_at` with the BFF's clock, would give the cockpit a
  // datum nobody measured.
  AttentionItem item = 2;
}

message WatchAttentionRequest {
  // The resume cursor: the last event of the core's LOG the client has already
  // processed. It crosses intact into the core's `since_event_id`, which drains
  // the log from there and only then splices into the live stream. In SSE the
  // equivalent is the `Last-Event-ID` header; here it is a field, because gRPC
  // has no such header.
  //
  // An honest caveat: `dop.v1.AttentionUpdate` does NOT carry the id of the
  // event that produced it, so neither this port nor the SSE can GIVE the
  // cursor back to the client. It works for whoever already knows their
  // position in the log (whoever also subscribes to WatchEvents); the
  // EventSource's automatic resume only closes the circuit once the core
  // publishes that id.
  string since_event_id = 1;
}

service AttentionService {
  // The box: the flat queue, the groups per demand and the account's badge.
  rpc ListAttention (ListAttentionRequest) returns (AttentionBox);
  // The box live — what opened and what closed, item by item.
  rpc WatchAttention (WatchAttentionRequest) returns (stream AttentionUpdate);

  // It does NOT exist, and the absence is the decision: no MarkRead, Dismiss or
  // Snooze. See this file's header — an item is born of an event and dies of
  // one.
}
