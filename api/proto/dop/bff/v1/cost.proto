syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/timestamp.proto";

// LLM cost at the EDGE: measurement, budget and routing (ADR-0008).
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// Three decisions structure this contract:
//
// 1. **Money is an `int64` in MICROS, with the currency alongside** — never a
//    `double`, never a decimal string, never "units and cents". A 64-bit float
//    does not represent 0.1 exactly; summing a thousand agent calls in float is
//    how the cent disappears, and disappears slowly, in the way that only shows
//    up at the end-of-month reconciliation. The edge PASSES ON the integer: it
//    does not divide by 1,000,000 to "make the screen's life easier" — the one
//    that formats is the screen, which knows the locale.
//
// 2. **A blown budget is not an error.** ADR-0008 §2 chose a SOFT cut: the
//    demand pauses and asks (the attention box), it never dies halfway nor
//    keeps burning. A 402/RESOURCE_EXHAUSTED here would be the hard cut the ADR
//    refused — and it would erase the measurement precisely when it matters
//    most. That is why `RecordUsage` answers OK with `budget_exceeded`, a
//    readable `notice` and the BLOWN budgets: that is what the attention box
//    draws for the human to decide (raise the ceiling, cut scope, close it).
//
// 3. **The routing's justification travels WHOLE.** See RoutingDecision.

// The same names and numbers as dop.v1.Money.
message Money {
  string currency      = 1;
  int64  amount_micros = 2;  // 10⁻⁶ of the currency
}

// One scope's budget, as the screen needs it.
message BudgetView {
  string scope    = 1;  // account | demand
  string scope_id = 2;
  // The ceiling. `currency` may come back EMPTY: dop.v1.Budget does not carry a
  // currency yet, and the edge does not invent "USD" — an empty currency means
  // "the core did not say".
  Money  limit    = 3;
  Money  spent    = 4;
  // ABSENT = a scope with NO CEILING (a zero limit, ADR-0008). Zero would mean
  // "the money ran out", which is the opposite. It is the same discipline as
  // Project.task_manager in hierarchy.proto.
  Money  remaining = 5;
}

// task → (model, effort), WITH the why.
//
// `reason` arrives from the core already prefixed by the policy's PROVENANCE —
// "ADR-0008 §3 (draft — calibrate with telemetry, P-7): …". The edge passes it
// on whole, and that is a rule, not carelessness:
//   - without it nobody audits "why did this demand run on the expensive
//     model?";
//   - without it nobody recalibrates: the table row that is wrong can only be
//     challenged if its reason is written down;
//   - and it is what says, in EVERY decision, that the policy is still a draft.
// Cutting, summarizing or splitting this string into "tidier" pieces would
// require parsing the core's text — a second dictionary, which ages
// separately.
message RoutingDecision {
  // mechanical | investigation | implementation | critic — and whatever else
  // the core accepts. An OPEN vocabulary on purpose (an unknown kind falls back
  // to the expensive path and says so), hence a string and not an enum: an enum
  // at the edge would close what the core left open.
  string task_kind = 1;
  string model     = 2;
  string effort    = 3;  // low | medium | high | xhigh | max
  string reason    = 4;
}

message UsageEvent {
  string id        = 1;
  string demand_id = 2;
  string thread_id = 3;
  string model     = 4;
  int64  input_tokens  = 5;
  int64  output_tokens = 6;
  // Zeroed on a prefix that should be stable = a silent cache invalidator = an
  // alert (ADR-0008 §1). The one who classifies is whoever has the telemetry;
  // the edge delivers the number.
  int64  cache_read_tokens     = 7;
  int64  cache_creation_tokens = 8;
  Money  cost = 9;
  // ABSENT = the core did not date the event. It does not become "epoch zero":
  // 1970 on a cost screen is an event that looks ancient rather than undated.
  google.protobuf.Timestamp at = 10;
}

message CostSummary {
  Money  total = 1;
  // A ratio, not money: here `double` is the right type.
  double cache_hit_ratio = 2;
  repeated UsageEvent recent = 3;
}

service CostService {
  rpc RouteModel   (RouteModelRequest)    returns (RoutingDecision);
  rpc GetBudget    (GetBudgetRequest)     returns (BudgetView);
  rpc SetBudget    (SetBudgetRequest)     returns (BudgetView);
  rpc RecordUsage  (RecordUsageRequest)   returns (RecordUsageOutcome);
  rpc SummarizeCost(SummarizeCostRequest) returns (CostSummary);
}

// A PURE decision: the same input, the same output. `demand_id` is here
// because P-7's calibration will want to correlate decision and spend per
// demand, but it takes no part in the decision today — and the contract does
// not pretend it does.
message RouteModelRequest { string task_kind = 1; string demand_id = 2; }

// An empty scope = 'account' with the active account. Asking the client to
// repeat the account id that is already in the metadata only creates an
// opportunity to repeat the WRONG id.
message GetBudgetRequest { string scope = 1; string scope_id = 2; }

// It sets the CEILING. `spent` is not accepted: the accumulated value is the
// system's, and accepting it from the client would let anyone zero the spend by
// asking.
//
// It carries no `idempotency_key`, and the absence is deliberate:
// dop.v1.SetBudget takes no key because the operation is idempotent by NATURE —
// it writes an absolute value, not an increment. Repeating the call writes the
// same ceiling. Announcing a field here that the core does not receive would be
// promising a guarantee the edge would silently discard.
message SetBudgetRequest {
  string scope        = 1;
  string scope_id     = 2;
  int64  limit_micros = 3;  // 0 = no ceiling
}

// Records model usage. The idempotency key is MANDATORY in the core, and for a
// different reason than usual: here a duplicate collides with nothing — it
// would come in as legitimate consumption and the budget would become fiction.
// Empty = the BFF generates one, which is what REST does.
message RecordUsageRequest {
  UsageEvent usage = 1;
  string idempotency_key = 10;
}

// The record's outcome. It is NOT an error even when the budget is blown (see
// the header, decision 2).
message RecordUsageOutcome {
  // True on a repeat too: from the caller's point of view the consumption IS
  // recorded, and returning false would lead them to try again.
  bool recorded = 1;
  bool budget_exceeded = 2;
  // A ready-made sentence for the attention box, empty when nothing was blown.
  // It says what HAPPENS (the demand pauses and asks) and what the human
  // decides — a bare "budget exceeded" would force every client to rewrite the
  // same explanation, each in its own way.
  string notice = 3;
  // The scopes consulted when something was blown: those are the numbers the
  // decision is made with. It comes back empty when nothing was blown — no
  // round trip to the core is spent drawing the normal case.
  repeated BudgetView budgets = 4;
}

message SummarizeCostRequest { string scope = 1; string scope_id = 2; }
