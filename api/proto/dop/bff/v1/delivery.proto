syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/struct.proto";

// Entrega na BORDA — pull requests, fila de merge por repositório e as
// diretrizes de coordenação do techlead.
//
// Mesma disciplina de identity.proto: identidade vem do token em
// `authorization: Bearer <token>`, conta ativa do metadado `x-account-id`. Não
// existe CallContext aqui.
//
// **Onde a borda ganha o sustento aqui: a RECUSA POR FALTA DE VERDE.** O núcleo
// recusa a entrada na fila com FAILED_PRECONDITION e uma frase que lista, item
// por item, o que falta ("nenhuma execução de aceitação aprovada…; falta o
// parecer do crítico…"). Essa lista é a coisa mais útil da resposta: é a
// receita do que fazer para conseguir entrar. Repassá-la como uma string só
// obrigaria cada cliente a separar por ponto-e-vírgula para conseguir mostrar
// uma lista — então a borda separa uma vez, em `MergeRefusal.missing`.
//
// A recusa vem como RESPOSTA, não como erro: para o agente que pede a entrada
// na fila, "ainda não, falta isto" é uma resposta com trabalho a fazer, não uma
// exceção (ADR-0007 §2). No REST ela sai como 412 com o mesmo corpo, porque lá
// o código de status é parte da resposta.

message Reviewer {
  string name     = 1;
  string initials = 2;
  // approved | rejected | pending. String, como em dop.v1: o vocabulário de
  // revisão é do provedor de git, e tipar aqui o que lá é livre criaria um
  // dicionário que a borda teria de manter sozinha.
  string status   = 3;
}

message PullRequest {
  string id            = 1;
  string demand_id     = 2;
  string repo          = 3;
  string source_branch = 4;
  string target_branch = 5;
  string url           = 6;
  bool   merged        = 7;
  bool   has_conflict  = 8;
  repeated Reviewer reviewers = 9;
  // Derivado na borda: quantos revisores ainda não se pronunciaram. É o número
  // que ordena "PR aguardando revisão" na caixa de atenção, e contar isso em
  // cada cliente é a mesma regra escrita três vezes.
  int32 pending_reviews = 10;
}

// Fila por repositório: rebase → re-verificação → merge, um por vez (ADR-0008).
// É o repositório que serializa — dois PRs em repositórios diferentes não
// invalidam um ao outro, e por isso não existe "a fila" no singular.
message MergeQueueEntry {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED      = 1;
    STATE_REBASING    = 2;
    STATE_VERIFYING   = 3;
    STATE_MERGED      = 4;
    STATE_CONFLICT    = 5;
  }
  string id       = 1;
  string repo_id  = 2;
  string demand_id = 3;
  int32  position = 4;
  State  state    = 5;
  // Detecção do techlead: os arquivos que esta entrada disputa com outra.
  repeated string overlapping_files = 6;
}

// Decisão do dev sobre uma transversal, aplicada pelos agentes (ADR-0015).
message Directive {
  enum Kind {
    KIND_UNSPECIFIED    = 0;
    KIND_CHERRY_PICK    = 1;
    KIND_MERGE_ORDER    = 2;
    KIND_FILE_PARTITION = 3;
    KIND_CROSS_VERIFY   = 4;
  }
  string id         = 1;
  string project_id = 2;
  Kind   kind       = 3;
  google.protobuf.Struct payload = 4;
  string decided_by_id   = 5;
  string decided_by_name = 6;
}

// A recusa da fila, item por item (ADR-0007).
message MergeRefusal {
  // A frase do núcleo sem o detalhe — "a fila de merge recusa entrada sem
  // evidência de verde do commit abc1234 (ADR-0007)".
  string reason = 1;
  // O que falta, um item por linha, na ordem em que o núcleo listou. Vazia
  // quando a recusa não é sobre verde (PR já mergeado, PR inexistente): aí a
  // razão sozinha já responde.
  repeated string missing = 2;
}

message DeliveryBoard {
  repeated PullRequest pull_requests = 1;
  repeated Directive   directives    = 2;
}

// ── requisições ─────────────────────────────────────────────────────────────

message GetDeliveryBoardRequest { string project_id = 1; }

message ListPullRequestsRequest {
  // Um dos dois: a demanda (tela da demanda) ou o projeto (tela de entrega).
  string demand_id  = 1;
  string project_id = 2;
}
message ListPullRequestsResponse { repeated PullRequest pull_requests = 1; }

message GetMergeQueueRequest  { string repo_id = 1; }
message GetMergeQueueResponse { repeated MergeQueueEntry entries = 1; }

message EnqueueMergeRequest {
  string repo_id   = 1;
  string demand_id = 2;
  string idempotency_key = 3;
}

// Exatamente um dos dois vem preenchido. Ausente ≠ zerado: uma entrada zerada
// e uma recusa são a diferença entre "está na fila" e "não está" — use
// HasField, nunca o valor dos campos.
message EnqueueMergeResponse {
  MergeQueueEntry entry   = 1;
  MergeRefusal    refusal = 2;
}

message ListDirectivesRequest  { string project_id = 1; }
message ListDirectivesResponse { repeated Directive directives = 1; }

message DecideDirectiveRequest {
  string directive_id = 1;
  google.protobuf.Struct decision = 2;
  string idempotency_key = 3;
}

service DeliveryService {
  // PRs + diretrizes do projeto numa resposta: a tela de entrega inteira.
  rpc GetDeliveryBoard (GetDeliveryBoardRequest) returns (DeliveryBoard);
  rpc ListPullRequests (ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc GetMergeQueue    (GetMergeQueueRequest)    returns (GetMergeQueueResponse);
  // Pode responder com a entrada OU com a recusa detalhada — ver MergeRefusal.
  rpc EnqueueMerge     (EnqueueMergeRequest)     returns (EnqueueMergeResponse);
  rpc ListDirectives   (ListDirectivesRequest)   returns (ListDirectivesResponse);
  rpc DecideDirective  (DecideDirectiveRequest)  returns (Directive);
}
