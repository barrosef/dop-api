syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/struct.proto";

// Delivery at the EDGE — pull requests, the per-repository merge queue and the
// techlead's coordination directives.
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// **Where the edge earns its keep here: the REFUSAL FOR WANT OF GREEN.** The
// core refuses entry into the queue with FAILED_PRECONDITION and a sentence
// that lists, item by item, what is missing ("no approved acceptance run…; the
// critic's verdict is missing…"). That list is the most useful thing in the
// answer: it is the recipe for what to do to get in. Passing it on as a single
// string would force every client to split on semicolons just to show a list —
// so the edge splits it once, into `MergeRefusal.missing`.
//
// The refusal comes as a RESPONSE, not as an error: for the agent asking to
// enter the queue, "not yet, this is missing" is an answer with work to do, not
// an exception (ADR-0005 §2). In REST it comes out as a 412 with the same body,
// because there the status code is part of the response.

message Reviewer {
  string name     = 1;
  string initials = 2;
  // approved | rejected | pending. A string, as in dop.v1: the review
  // vocabulary is the git provider's, and typing here what is free there would
  // create a dictionary the edge would have to maintain on its own.
  string status   = 3;
}

message PullRequest {
  string id            = 1;
  string demand_id     = 2;
  string repo          = 3;
  string source_branch = 4;
  string target_branch = 5;
  string url           = 6;
  bool   merged        = 7;
  bool   has_conflict  = 8;
  repeated Reviewer reviewers = 9;
  // Derived at the edge: how many reviewers have not spoken yet. It is the
  // number that orders "a PR awaiting review" in the attention box, and
  // counting it in each client is the same rule written three times.
  int32 pending_reviews = 10;
}

// A queue per repository: rebase → re-verification → merge, one at a time
// (ADR-0005). It is the repository that serializes — two PRs in different
// repositories do not invalidate each other, and that is why there is no "the
// queue" in the singular.
message MergeQueueEntry {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED      = 1;
    STATE_REBASING    = 2;
    STATE_VERIFYING   = 3;
    STATE_MERGED      = 4;
    STATE_CONFLICT    = 5;
  }
  string id       = 1;
  string repo_id  = 2;
  string demand_id = 3;
  int32  position = 4;
  State  state    = 5;
  // The techlead's detection: the files this entry contends for with another.
  repeated string overlapping_files = 6;
}

// The dev's decision about a cross-cutting concern, applied by the agents
// (ADR-0011).
message Directive {
  enum Kind {
    KIND_UNSPECIFIED    = 0;
    KIND_CHERRY_PICK    = 1;
    KIND_MERGE_ORDER    = 2;
    KIND_FILE_PARTITION = 3;
    KIND_CROSS_VERIFY   = 4;
  }
  string id         = 1;
  string project_id = 2;
  Kind   kind       = 3;
  google.protobuf.Struct payload = 4;
  string decided_by_id   = 5;
  string decided_by_name = 6;
}

// The queue's refusal, item by item (ADR-0005).
message MergeRefusal {
  // The core's sentence without the detail — "the merge queue refuses entry
  // with no evidence of green for commit abc1234 (ADR-0005)".
  string reason = 1;
  // What is missing, one item per line, in the order the core listed them.
  // Empty when the refusal is not about green (an already merged PR, a
  // nonexistent PR): there the reason alone already answers.
  repeated string missing = 2;
}

message DeliveryBoard {
  repeated PullRequest pull_requests = 1;
  repeated Directive   directives    = 2;
}

// ── requests ────────────────────────────────────────────────────────────────

message GetDeliveryBoardRequest { string project_id = 1; }

message ListPullRequestsRequest {
  // One of the two: the demand (the demand's screen) or the project (the
  // delivery screen).
  string demand_id  = 1;
  string project_id = 2;
}
message ListPullRequestsResponse { repeated PullRequest pull_requests = 1; }

message GetMergeQueueRequest  { string repo_id = 1; }
message GetMergeQueueResponse { repeated MergeQueueEntry entries = 1; }

message EnqueueMergeRequest {
  string repo_id   = 1;
  string demand_id = 2;
  string idempotency_key = 3;
}

// Exactly one of the two comes filled in. Absent ≠ zeroed: a zeroed entry and a
// refusal are the difference between "it is in the queue" and "it is not" — use
// HasField, never the fields' values.
message EnqueueMergeResponse {
  MergeQueueEntry entry   = 1;
  MergeRefusal    refusal = 2;
}

message ListDirectivesRequest  { string project_id = 1; }
message ListDirectivesResponse { repeated Directive directives = 1; }

message DecideDirectiveRequest {
  string directive_id = 1;
  google.protobuf.Struct decision = 2;
  string idempotency_key = 3;
}

service DeliveryService {
  // The project's PRs + directives in one response: the whole delivery screen.
  rpc GetDeliveryBoard (GetDeliveryBoardRequest) returns (DeliveryBoard);
  rpc ListPullRequests (ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc GetMergeQueue    (GetMergeQueueRequest)    returns (GetMergeQueueResponse);
  // It may answer with the entry OR with the detailed refusal — see
  // MergeRefusal.
  rpc EnqueueMerge     (EnqueueMergeRequest)     returns (EnqueueMergeResponse);
  rpc ListDirectives   (ListDirectivesRequest)   returns (ListDirectivesResponse);
  rpc DecideDirective  (DecideDirectiveRequest)  returns (Directive);
}
