syntax = "proto3";
package dop.bff.v1;

import "dop/bff/v1/workflow.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A demand at the EDGE — the cockpit's unit of work: the frozen flow's stages,
// the agents' threads and the board of findings.
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// **Where the edge earns its keep here: the COCKPIT in one call.** The demand's
// screen shows the stages, the threads and the findings together — in the core
// those are separate RPCs, and asking for them in series would make the screen
// assemble in three beats. And the derived fields (`current_stage_key`,
// `blocked`, `awaiting_decision`) come out of here ready-made: they are the
// SAME little rule the cockpit, dop-cli and the agent would each write in their
// own way, and three different readings of "where the demand is" is how the
// list and the screen start disagreeing.
//
// The stage vocabulary (StageType, ArtifactKind, Gate) comes from
// workflow.proto, as in dop.v1: the demand's stage is the instance of what the
// flow's specification describes.

// The demand's situation in our vocabulary — the task provider's travels
// separately, in `provider_status`. The same names and numbers as
// dop.v1.DopStatus.
enum DopStatus {
  DOP_STATUS_UNSPECIFIED = 0;
  DOP_STATUS_NEW         = 1;
  DOP_STATUS_DOING       = 2;
  DOP_STATUS_DONE        = 3;
  DOP_STATUS_DELIVERED   = 4;
}

// The same names and numbers as dop.v1.StageStatus.
enum StageStatus {
  STAGE_STATUS_UNSPECIFIED = 0;
  STAGE_STATUS_PENDING     = 1;
  STAGE_STATUS_RUNNING     = 2;
  STAGE_STATUS_BLOCKED     = 3;
  STAGE_STATUS_DONE        = 4;
}

message Artifact {
  string       id         = 1;
  ArtifactKind kind       = 2;
  string       name       = 3;
  string       object_ref = 4;  // an ObjectStore pointer, never the content
  int32        version    = 5;
}

message Stage {
  string      key    = 1;
  string      name   = 2;
  StageType   type   = 3;
  StageStatus status = 4;
  Gate        gate   = 5;
  repeated Artifact artifacts = 6;
  // Genuinely optional: a stage that has not started has no start, and a zero
  // here would become 1970 on the screen. Absent ≠ zeroed — use HasField.
  google.protobuf.Timestamp started_at  = 7;
  google.protobuf.Timestamp finished_at = 8;
  // Derived at the edge: the stage has a human gate and is waiting for somebody
  // (it started and did not finish). It is the attention box's "a spec awaiting
  // approval" item, and the exact condition the core accepts in DecideGate.
  bool awaiting_decision = 9;
}

message Demand {
  string    id              = 1;
  string    project_id      = 2;
  string    external_key    = 3;   // SUOPT-1315
  string    title           = 4;
  string    card_type       = 5;   // dynamic, the provider's
  string    provider_status = 6;   // raw, the provider's — not ours
  DopStatus dop_status      = 7;
  // The flow's version, FROZEN when it started (ADR-0014 §4): a demand under
  // way does not change process halfway through.
  string    flow_id      = 8;
  int32     flow_version = 9;
  repeated Stage stages   = 10;
  // ── derived at the edge, so the LIST and the screen say the same thing ────
  // The first stage that is not finished: "where the demand is".
  string current_stage_key  = 11;
  // Some stage is blocked — the list's red.
  bool   blocked            = 12;
  // Some stage is waiting for a human decision — what calls the dev.
  bool   awaiting_decision  = 13;
}

// The thread's agent brief: purpose, tools, model and budget.
message AgentCard {
  string purpose = 1;
  repeated string tools = 2;   // the MCPs and skills granted
  string model   = 3;
  string effort  = 4;          // low | medium | high | xhigh | max
  int64  budget_micros = 5;
}

// One thread per agent — the dev talks without mixing timelines (ADR-0010).
message Thread {
  string id      = 1;
  string key     = 2;   // main, db-forensics, logs
  bool   blocked = 3;   // a pending question → the attention box
  // Optional: a thread with no brief is different from a thread with an empty
  // brief (one has no agent behind it; the other would have an agent with
  // neither purpose nor budget).
  AgentCard card = 4;
}

message Message {
  string id        = 1;
  string thread_id = 2;
  // A flattened author: in the core it is an ActorRef, but here a three-field
  // wrapper would cost more client lines than it conveys.
  string author_kind = 3;  // user | agent | subagent | system
  string author_id   = 4;
  string author_name = 5;
  string text        = 6;
  google.protobuf.Timestamp at = 7;
}

// A conclusion published by an agent — it becomes the siblings' context and
// memory.
message Finding {
  string id        = 1;
  string thread_id = 2;
  string title     = 3;
  google.protobuf.Struct payload = 4;
}

// The demand's whole screen, in one response.
message DemandCockpit {
  Demand demand = 1;
  repeated Thread threads = 2;
  // The demand's board of findings, read from dop.v1 ListFindings.
  repeated Finding findings = 3;

  // 4 was `findings_available`, and it was REMOVED, not renamed.
  //
  // It existed because the core's contract had no way to read findings: the
  // list came back empty and the flag separated "this demand has no findings"
  // from "the edge cannot read findings". With ListFindings in the contract the
  // second case stopped existing — either the read works and the list is the
  // answer, or the whole call fails with the core's status. The flag would be a
  // constant `true`, and a field that can only say one thing becomes noise
  // somebody one day reads backwards. An empty list now means an empty list.
  //
  // The number stays reserved: reusing it would make an old client read the new
  // field as if it were the old flag, in silence.
  reserved 4;
  reserved "findings_available";
}

// ── requests ────────────────────────────────────────────────────────────────

message ListDemandsRequest {
  // Empty = every demand visible in the active account.
  string project_id = 1;
  int32  page_size  = 2;
  string page_token = 3;
}
message ListDemandsResponse {
  repeated Demand demands = 1;
  string next_page_token  = 2;  // empty = that was the last page
}

message GetDemandRequest { string id = 1; }

message GetDemandCockpitRequest { string demand_id = 1; }

// A demand is born of a provider's card: the external key is its identity out
// there. The flow is NOT chosen here — it is resolved by the chain and frozen.
message StartDemandRequest {
  string project_id   = 1;
  string external_key = 2;
  string idempotency_key = 3;
}

message AdvanceStageRequest {
  string      demand_id = 1;
  string      stage_key = 2;
  StageStatus status    = 3;
  string      idempotency_key = 4;
}

// A human gate: approving finishes the stage; rejecting BLOCKS it with the
// comment (the core does not send it back to pending — a rejection that
// disappears from the screen is half the value of human validation thrown
// away).
message DecideGateRequest {
  string demand_id = 1;
  string stage_key = 2;
  bool   approved  = 3;
  string comment   = 4;
  string idempotency_key = 5;
}

message ListThreadsRequest  { string demand_id = 1; }
message ListThreadsResponse { repeated Thread threads = 1; }

message CreateThreadRequest {
  string    demand_id = 1;
  string    key       = 2;
  AgentCard card      = 3;
  string    idempotency_key = 4;
}

message PostMessageRequest {
  string thread_id = 1;
  string text      = 2;
  string idempotency_key = 3;
}

message PublishFindingRequest {
  string demand_id = 1;
  string thread_id = 2;
  string title     = 3;
  google.protobuf.Struct payload = 4;
  string idempotency_key = 5;
}

service DemandService {
  rpc ListDemands   (ListDemandsRequest)   returns (ListDemandsResponse);
  rpc GetDemand     (GetDemandRequest)     returns (Demand);
  // Stages + threads + findings in one go: the cockpit's screen.
  rpc GetDemandCockpit (GetDemandCockpitRequest) returns (DemandCockpit);
  rpc StartDemand   (StartDemandRequest)   returns (Demand);
  rpc AdvanceStage  (AdvanceStageRequest)  returns (Stage);
  rpc DecideGate    (DecideGateRequest)    returns (Stage);
  rpc ListThreads   (ListThreadsRequest)   returns (ListThreadsResponse);
  rpc CreateThread  (CreateThreadRequest)  returns (Thread);
  rpc PostMessage   (PostMessageRequest)   returns (Message);
  rpc PublishFinding(PublishFindingRequest) returns (Finding);
  // WatchDemand (a stream) is NOT here: the edge's streaming/SSE layer is
  // separate work and comes in when it exists. A stream RPC declared with no
  // servicer behind it would be an UNIMPLEMENTED announced in the reflection.
}
