syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/timestamp.proto";

// The execution substrate at the EDGE: the demand's sandbox (the substrate
// spec).
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// **This contract's hard rule: `min_tier` is DECLARED, never presumed.**
// Without it the core REFUSES, and the edge does not fill the gap to "make life
// easier" — a default here would be the platform choosing the isolation of code
// it did not write, and choosing downwards (a namespace is what always exists).
// Whoever asks for a microVM and gets a container does not find out from the
// screen; they find out from the incident. That is why the edge refuses BEFORE
// spending the round trip to the core, with a message, and the refusal is
// INVALID_ARGUMENT (a 422 in REST) — an incomplete request, not a server
// failure.
//
// **DestroySandbox is IRREVERSIBLE and takes the WORKSPACE with it.** It is not
// the inverse of `Suspend`: suspending kills the execution and preserves the
// workspace on the PVC (it is the saving operation); destroying erases both. A
// destroyed sandbox does NOT resume — `Resume` refuses, and the way forward is
// to provision a new one for the demand, from scratch, with no worktree, no
// build and none of what the agent had already learned on disk.

// The same NAMES and the same numbers as dop.v1.IsolationTier — the conversion
// between the two ends is the identity, not a translation (the substrate spec
// §1).
enum IsolationTier {
  ISOLATION_TIER_UNSPECIFIED     = 0;  // an INCOMPLETE request, never a default
  ISOLATION_TIER_HARDWARE        = 1;  // Kata/Firecracker — microVM
  ISOLATION_TIER_KERNEL_EMULATED = 2;  // gVisor / Edera
  ISOLATION_TIER_NAMESPACE       = 3;  // a container with a strict securityContext
}

// A service of the demand's stack, published on the ingress.
message SandboxEndpoint {
  string name  = 1;  // portal-frontend, portal-backend, mysql
  string url   = 2;
  int32  port  = 3;
  string state = 4;  // running | stopped
}

message Sandbox {
  // The same names and numbers as dop.v1.Sandbox.State.
  enum State {
    STATE_UNSPECIFIED  = 0;
    STATE_PROVISIONING = 1;  // the trace of an attempt that did not finish
    STATE_ACTIVE       = 2;
    STATE_SUSPENDED    = 3;  // the execution dead, the workspace alive
    STATE_DESTROYED    = 4;  // terminal: it does not resume
  }
  string        id        = 1;
  string        demand_id = 2;
  State         state     = 3;
  // What the substrate DELIVERED — the client sees what it got (spec §2). The
  // core refuses when the adapter delivers a level different from the declared
  // one, so this field is never a promise: it is the fact.
  IsolationTier tier      = 4;
  string        namespace = 5;
  repeated SandboxEndpoint endpoints = 6;
  // ABSENT = no activity recorded (a freshly created sandbox). It does not
  // become epoch zero: "idle since 1970" would make the automatic suspension
  // read it wrong.
  google.protobuf.Timestamp last_active_at = 7;
}

service ExecutionService {
  rpc ProvisionSandbox(ProvisionSandboxRequest) returns (Sandbox);
  rpc DescribeSandbox (DescribeSandboxRequest)  returns (Sandbox);
  rpc SuspendSandbox  (SuspendSandboxRequest)   returns (Sandbox);
  rpc ResumeSandbox   (ResumeSandboxRequest)    returns (Sandbox);
  // IRREVERSIBLE: it erases the execution AND the demand's workspace. See the
  // header.
  rpc DestroySandbox  (DestroySandboxRequest)   returns (DestroySandboxResponse);

  // StreamLogs (dop.v1.ExecutionService) is NOT on this port yet. The edge's
  // whole streaming story (SSE in REST, server-streaming in gRPC) is being
  // designed separately; exposing half a solution here would create a second
  // stream design to undo later.
}

message ProvisionSandboxRequest {
  string demand_id = 1;
  // MANDATORY. ISOLATION_TIER_UNSPECIFIED is refused at the edge, with a
  // message: "declared, never presumed" dies the day somebody fills the gap out
  // of politeness.
  IsolationTier min_tier = 2;
  string idempotency_key = 10;
}

message DescribeSandboxRequest { string id = 1; }
message SuspendSandboxRequest  { string id = 1; }
message ResumeSandboxRequest   { string id = 1; }
message DestroySandboxRequest  { string id = 1; }

// It returns a confirmation rather than nothing: an irreversible act deserves
// an answer the client can show ("destroyed"), not a silence it has to deduce.
message DestroySandboxResponse { bool destroyed = 1; }
