syntax = "proto3";
package dop.bff.v1;

// Hierarchy at the EDGE: the active account's workspaces (level 1) and projects
// (level 2).
//
// The same discipline as identity.proto: identity does NOT travel in the body —
// it comes from the token in `authorization: Bearer <token>`, and the active
// account from the `x-account-id` metadata. There is no CallContext here.
//
// Vocabulary, because confusing the two is expensive: **a workspace is OUR
// concept**. The task provider's "space" (Jira, ClickUp) is another thing and
// appears as `external_space_id` — never the bare word workspace for both.

message Workspace {
  string id          = 1;
  string name        = 2;
  // A short uppercase key: it is what prefixes a demand's identifier.
  string key         = 3;
  string description = 4;
  repeated string tags = 5;
}

// TaskManagerBinding is the project's link to the provider's board.
message TaskManagerBinding {
  string integration_id      = 1;
  string external_space_id   = 2;
  string external_project_id = 3;
  // Dynamic: the one that rules the card vocabulary is the provider
  // (ADR-0013).
  repeated string card_types = 4;
}

message Project {
  string id           = 1;
  string workspace_id = 2;
  string name         = 3;
  string description  = 4;
  repeated string rules = 5;
  // Optional: not every project has a board. Absent ≠ zeroed.
  TaskManagerBinding task_manager = 6;
}

// TreeNode is a workspace with its projects. It exists so the cockpit's sidebar
// comes in ONE response — fetching the workspaces and then a ListProjects per
// workspace would make the navigation flicker across N requests.
message TreeNode {
  Workspace workspace = 1;
  repeated Project projects = 2;
}

message GetTreeRequest {}
message GetTreeResponse { repeated TreeNode nodes = 1; }

message ListWorkspacesRequest {}
message ListWorkspacesResponse { repeated Workspace workspaces = 1; }

message CreateWorkspaceRequest {
  string name        = 1;
  string key         = 2;
  string description = 3;
  repeated string tags = 4;
  string idempotency_key = 5;
}

message ListProjectsRequest {
  // Empty = every project of the active account.
  string workspace_id = 1;
}
message ListProjectsResponse { repeated Project projects = 1; }

message GetProjectRequest { string id = 1; }

message CreateProjectRequest {
  // The account is NOT supplied: it is inherited from the workspace. Letting
  // the caller supply it would open the way for a project to be born in
  // somebody else's account.
  string workspace_id = 1;
  string name         = 2;
  string description  = 3;
  string idempotency_key = 4;
}

message BindTaskManagerRequest {
  string project_id = 1;
  TaskManagerBinding binding = 2;
}

service HierarchyService {
  rpc GetTree         (GetTreeRequest)         returns (GetTreeResponse);
  rpc ListWorkspaces  (ListWorkspacesRequest)  returns (ListWorkspacesResponse);
  rpc CreateWorkspace (CreateWorkspaceRequest) returns (Workspace);
  rpc ListProjects    (ListProjectsRequest)    returns (ListProjectsResponse);
  rpc GetProject      (GetProjectRequest)      returns (Project);
  rpc CreateProject   (CreateProjectRequest)   returns (Project);
  // A replacement of the link; the BFF preserves the rest of the project
  // internally.
  rpc BindTaskManager (BindTaskManagerRequest) returns (Project);
}
