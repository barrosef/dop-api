syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/timestamp.proto";

// The DOP platform's EDGE contract — what the cockpit, dop-cli and the agents
// consume. Deliberately DIFFERENT from the core's contract (dop.v1).
//
// Why two contracts: the core keeps the state, so its model is normalized and
// granular — Account, Membership and User are separate things because in the
// database they are separate. The edge serves the SCREEN: `Me` answers in one
// call what in the core would take EnsureUser + ListAccounts + ListMemberships.
// Aggregating here is the BFF's job; mirroring dop.v1 would be just an
// expensive proxy.
//
// The vocabulary, that one IS the same: Role, Kind and Status repeat the name
// AND the number of dop.v1's enums. Diverging on purpose would create a
// parallel dictionary, and that is exactly where a translation bug between the
// two ends is born.
//
// Identity does NOT travel in the body. There is no CallContext here: the
// caller comes from the TOKEN, in the `authorization: Bearer <token>` metadata,
// exactly as in REST. The interceptor verifies the token, asks the core who the
// user is and what their role is, and injects it all into the context. The
// active account comes from the `x-account-id` metadata — it is the interface's
// selector, not a field the client can forge inside the message.

// ── vocabulary shared with dop.v1 ───────────────────────────────────────────

// The four predefined roles. The same names and the same numbers as
// dop.v1.Role: the conversion between the two ends is the identity, not a
// translation.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER       = 1;
  ROLE_ADMIN       = 2;
  ROLE_DEVELOPER   = 3;
  ROLE_VIEWER      = 4;
}

// A grant over a resource, composed IN THE INVITE — with no defaults
// (ADR-0009). Here the resource is the raw id, and not a ResourceRef: the edge
// already knows which account it is talking about (it comes from the metadata),
// and a one-field wrapper would cost more client lines than it conveys.
message ResourceGrantSpec {
  string resource_id = 1;
  string level       = 2;  // use | manage
}

// ── the edge's models ───────────────────────────────────────────────────────

// Who I am, in the active account. It joins the identity provider's principal
// with what the core answered about them — it is every client's first call.
message Me {
  // The subject at the identity provider (Firebase today, ADR-0001). It comes
  // from the token.
  string subject = 1;
  // The user's id IN THE CORE — it is not the subject. Resolved by EnsureUser
  // during authentication. This is the one that shows up in the audit trail and
  // in every domain reference.
  string user_id = 2;
  string email   = 3;
  string name    = 4;
  // password, google.com, github.com, linkedin.com — already normalized.
  repeated string providers = 5;

  // The active account and the role in it. They come back empty when the client
  // has not chosen an account yet: that is a VALID state, and it is how the
  // cockpit loads the selector right after login.
  string account_id = 10;
  Role   role       = 11;
}

// An account as the screen needs it: the account's data PLUS the asker's role.
// In the core those are two entities (Account and Membership); joining them is
// the reason this contract exists.
message AccountSummary {
  // The same names and numbers as dop.v1.Account.Kind.
  enum Kind {
    KIND_UNSPECIFIED  = 0;
    KIND_PERSONAL     = 1;
    KIND_ORGANIZATION = 2;
  }
  string id           = 1;
  Kind   kind         = 2;
  string handle       = 3;  // unique on the platform; individuals and
                            // organizations share the namespace
  string display_name = 4;
  // The caller's role IN THIS account. It is only filled in for the ACTIVE
  // account — that is the one the interceptor resolved against the core.
  // Inventing a role for the others would be lying cheaply.
  Role   role         = 5;
}

// A member of the active account. `user_id` is the id in the core, the same as
// Me.user_id — it is what lets a client recognize itself in the list.
message MemberSummary {
  string id      = 1;  // the membership's id, not the user's
  string user_id = 2;
  Role   role    = 3;
}

message InviteSummary {
  // The same names and numbers as dop.v1.Invite.Status.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING     = 1;
    STATUS_ACCEPTED    = 2;
    STATUS_EXPIRED     = 3;
    STATUS_REVOKED     = 4;
  }
  string id     = 1;
  string email  = 2;
  Role   role   = 3;
  Status status = 4;
  google.protobuf.Timestamp expires_at = 5;

  // There is no token here because the invite HAS no token (ADR-0019). The
  // `id` is what the e-mail's link carries, and on its own it grants nothing:
  // acceptance requires the session's VERIFIED e-mail to be the invite's. That
  // is what lets the id travel in the event, in the timeline and in the
  // message with no risk.
}

// What whoever OPENS the invite's link sees, before signing in or after.
//
// It says the minimum needed to decide the screen, and it does NOT say who the
// invite was for: whoever finds the link must not learn an address from it —
// that would turn it back into an oracle, which is what taking the token out
// was meant to end.
message InvitePreview {
  string id           = 1;
  string account_name = 2;
  Role   role         = 3;
  InviteSummary.Status status = 4;
  google.protobuf.Timestamp expires_at = 5;
  // usable says whether it is still worth answering — pending and not expired.
  bool usable = 6;
}

// ── the service ─────────────────────────────────────────────────────────────

// It mirrors, RPC by RPC, the use cases that already exist in REST. The logic
// is literally the same function (app/usecases/identity.py): this service is a
// second door into the same room, not a second implementation.
service IdentityService {
  rpc GetMe        (GetMeRequest)        returns (Me);
  rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
  rpc ListMembers  (ListMembersRequest)  returns (ListMembersResponse);
  rpc CreateAccount(CreateAccountRequest) returns (AccountSummary);
  rpc CreateInvite (CreateInviteRequest)  returns (InviteSummary);
  rpc ListInvites  (ListInvitesRequest)   returns (ListInvitesResponse);
  rpc GetInvite    (GetInviteRequest)     returns (InvitePreview);
  rpc AcceptInvite (AcceptInviteRequest)  returns (AcceptInviteResponse);
  rpc RevokeInvite (RevokeInviteRequest)  returns (InviteSummary);
  rpc UpdateMember (UpdateMemberRequest)  returns (MemberSummary);
}

message ListInvitesRequest  {}
message ListInvitesResponse { repeated InviteSummary invites = 1; }

// GetInvite is the ONE identity RPC that does not require an active account:
// whoever opens the link may not be a member of anything yet — that is the
// point of an invite.
message GetInviteRequest { string id = 1; }

message AcceptInviteRequest { string id = 1; }

message AcceptInviteResponse {
  // The account the person has just joined, so the cockpit can switch to it
  // without a second round trip: whoever accepts an invite wants to be inside.
  AccountSummary account = 1;
  Role role = 2;
}

message RevokeInviteRequest { string id = 1; }

message UpdateMemberRequest {
  string membership_id = 1;
  Role   role          = 2;
}

// Empty because everything it would need to say is already in the metadata: the
// token says who, x-account-id says where. An empty message is more honest than
// a `user_id` field the server would be obliged to ignore.
message GetMeRequest {}

// With no active account on purpose: it is precisely the call the client makes
// BEFORE any account has been chosen, so it can choose.
message ListAccountsRequest {}
message ListAccountsResponse { repeated AccountSummary accounts = 1; }

// Always the ACTIVE account (the metadata's). It takes no account_id: accepting
// an id in the body would open a second source of truth about scope, and the
// two would disagree on the first bug.
message ListMembersRequest  {}
message ListMembersResponse { repeated MemberSummary members = 1; }

// It creates an organization. Any user may create their own — what is required
// is an active account (SP-0): the creation happens from within a context.
message CreateAccountRequest {
  string handle       = 1;
  string display_name = 2;
  string legal_id     = 3;  // the company's registration number

  // Every write carries an idempotency key (ADR-0013): repeating the call must
  // not duplicate the effect. The one that sends it is the CLIENT, because it is
  // the one that knows whether it is retrying or asking for something else.
  // Empty = the BFF generates one, which is what REST does — it protects against
  // the channel's retry, not against the user's.
  string idempotency_key = 10;
}

// It invites somebody to the active account.
message CreateInviteRequest {
  string email = 1;
  Role   role  = 2;
  repeated ResourceGrantSpec grants = 3;
  string idempotency_key = 10;
}
