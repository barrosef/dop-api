syntax = "proto3";
package dop.bff.v1;

// Contrato de BORDA da plataforma DOP — o que o cockpit, o dop-cli e os agentes
// consomem. Deliberadamente DIFERENTE do contrato do núcleo (dop.v1).
//
// Por que dois contratos: o núcleo guarda o estado, então o modelo dele é
// normalizado e granular — Account, Membership e User são coisas separadas
// porque no banco elas são separadas. A borda serve TELA: `Me` responde numa
// chamada o que no núcleo exigiria EnsureUser + ListAccounts + ListMemberships.
// Agregar aqui é o trabalho do BFF; espelhar dop.v1 seria só um proxy caro.
//
// O vocabulário, esse SIM é o mesmo: Role, Kind e Status repetem nome E número
// dos enums de dop.v1. Divergir de propósito criaria um dicionário paralelo, e
// é exatamente daí que nasce bug de tradução entre as duas pontas.
//
// Identidade NÃO viaja no corpo. Não existe CallContext aqui: quem chama vem do
// TOKEN, no metadado `authorization: Bearer <token>`, exatamente como no REST.
// O interceptor verifica o token, pergunta ao núcleo quem é o usuário e qual o
// papel dele, e injeta tudo no contexto. Conta ativa vem do metadado
// `x-account-id` — é o seletor da interface, não um campo que o cliente pode
// forjar dentro da mensagem.

// ── vocabulário compartilhado com dop.v1 ────────────────────────────────────

// Os quatro papéis pré-definidos. Mesmos nomes e mesmos números de
// dop.v1.Role: a conversão entre as pontas é identidade, não tradução.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER       = 1;
  ROLE_ADMIN       = 2;
  ROLE_DEVELOPER   = 3;
  ROLE_VIEWER      = 4;
}

// Concessão sobre um recurso, composta NO CONVITE — sem defaults (ADR-0013).
// Aqui o recurso é o id cru, e não um ResourceRef: a borda já sabe de qual
// conta está falando (vem do metadado), e um wrapper de um campo só custaria
// mais linhas de cliente do que informa.
message ResourceGrantSpec {
  string resource_id = 1;
  string level       = 2;  // use | manage
}

// ── modelos da borda ────────────────────────────────────────────────────────

// Quem sou eu, na conta ativa. Junta o principal do provedor de identidade com
// o que o núcleo respondeu sobre ele — é a primeira chamada de todo cliente.
message Me {
  // Sujeito no provedor de identidade (Firebase hoje, ADR-0001). Vem do token.
  string subject = 1;
  // Id do usuário NO NÚCLEO — não é o subject. Resolvido pelo EnsureUser
  // durante a autenticação. É este que aparece em auditoria e em toda
  // referência de domínio.
  string user_id = 2;
  string email   = 3;
  string name    = 4;
  // password, google.com, github.com, linkedin.com — já normalizados.
  repeated string providers = 5;

  // Conta ativa e papel nela. Vêm vazios quando o cliente ainda não escolheu
  // conta: é um estado VÁLIDO, e é assim que o cockpit carrega o seletor logo
  // após o login.
  string account_id = 10;
  Role   role       = 11;
}

// Conta como a tela precisa dela: os dados da conta MAIS o papel de quem
// pergunta. No núcleo isso são duas entidades (Account e Membership); juntar
// as duas é o motivo deste contrato existir.
message AccountSummary {
  // Mesmos nomes e números de dop.v1.Account.Kind.
  enum Kind {
    KIND_UNSPECIFIED  = 0;
    KIND_PERSONAL     = 1;
    KIND_ORGANIZATION = 2;
  }
  string id           = 1;
  Kind   kind         = 2;
  string handle       = 3;  // único na plataforma; PF e PJ dividem o namespace
  string display_name = 4;
  // Papel do chamador NESTA conta. Só é preenchido para a conta ATIVA — foi
  // ela que o interceptor resolveu contra o núcleo. Inventar papel para as
  // outras seria mentir barato.
  Role   role         = 5;
}

// Membro da conta ativa. `user_id` é o id no núcleo, o mesmo de Me.user_id —
// é o que permite o cliente reconhecer a si mesmo na lista.
message MemberSummary {
  string id      = 1;  // id do vínculo (Membership), não do usuário
  string user_id = 2;
  Role   role    = 3;
}

message InviteSummary {
  // Mesmos nomes e números de dop.v1.Invite.Status.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING     = 1;
    STATUS_ACCEPTED    = 2;
    STATUS_EXPIRED     = 3;
    STATUS_REVOKED     = 4;
  }
  string id     = 1;
  string email  = 2;
  Role   role   = 3;
  Status status = 4;
  // O token do convite NÃO aparece aqui, de propósito: ele sai pelo canal de
  // comunicação (P-11). Quem perder o link precisa de convite novo.
}

// ── serviço ─────────────────────────────────────────────────────────────────

// Espelha, RPC a RPC, os casos de uso que já existem em REST. A lógica é
// literalmente a mesma função (app/usecases/identity.py): este serviço é uma
// segunda porta para a mesma sala, não uma segunda implementação.
service IdentityService {
  rpc GetMe        (GetMeRequest)        returns (Me);
  rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
  rpc ListMembers  (ListMembersRequest)  returns (ListMembersResponse);
  rpc CreateAccount(CreateAccountRequest) returns (AccountSummary);
  rpc CreateInvite (CreateInviteRequest)  returns (InviteSummary);
}

// Vazia porque tudo que ela precisaria dizer já está no metadado: o token diz
// quem, o x-account-id diz onde. Uma mensagem vazia é mais honesta do que um
// campo `user_id` que o servidor teria obrigação de ignorar.
message GetMeRequest {}

// Sem conta ativa de propósito: é justamente a chamada que o cliente faz ANTES
// de haver conta escolhida, para poder escolher.
message ListAccountsRequest {}
message ListAccountsResponse { repeated AccountSummary accounts = 1; }

// Sempre a conta ATIVA (a do metadado). Não recebe account_id: aceitar um id
// no corpo abriria uma segunda fonte de verdade sobre escopo, e as duas
// discordariam no primeiro bug.
message ListMembersRequest  {}
message ListMembersResponse { repeated MemberSummary members = 1; }

// Cria uma organização. Qualquer usuário pode criar a sua — o que se exige é
// conta ativa (SP-0): a criação acontece a partir de um contexto.
message CreateAccountRequest {
  string handle       = 1;
  string display_name = 2;
  string legal_id     = 3;  // CNPJ

  // Toda escrita leva chave de idempotência (ADR-0017): repetir a chamada não
  // pode duplicar efeito. Quem envia é o CLIENTE, porque é ele quem sabe se
  // está tentando de novo ou pedindo outra coisa. Vazio = o BFF gera uma, que
  // é o que o REST faz — protege contra o retry do canal, não contra o do
  // usuário.
  string idempotency_key = 10;
}

// Convida alguém para a conta ativa.
message CreateInviteRequest {
  string email = 1;
  Role   role  = 2;
  repeated ResourceGrantSpec grants = 3;
  string idempotency_key = 10;
}
