syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/struct.proto";
// `Finding` already exists in the edge's contract, in demand.proto, with
// exactly these fields. Redeclaring it here (the same package!) would not
// compile and would be the parallel dictionary this contract exists to avoid:
// the finding that goes into the context package and the finding that shows up
// in the demand's cockpit are the SAME thing seen from two places.
import "dop/bff/v1/demand.proto";

// Knowledge at the EDGE: the project's rules, index and memory (ADR-0009).
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// **The decision that structures this contract: what was DROPPED is
// first-class information.** The context package is SELECTED by a token budget
// (ADR-0012), and a truncated package presenting itself as complete makes the
// screen lie to the dev: they read "the agent has the index" when half the
// index was left out. That is why `ContextPackage.dropped` exists — and why it
// is a MESSAGE and not four loose counters: absent means "the core did not
// say", zeroed means "nothing was dropped". Confusing the two is exactly the
// lie this field exists to prevent.
//
// The edge's other job here is undoing two shapes of the core that serve the
// database and not the screen:
//   - `dop.v1.SearchMemoryResponse` returns artifacts and scores in PARALLEL
//     lists; here they come PAIRED (MemoryHit), because a crossed index is a
//     bug waiting for a distracted client;
//   - the small artifact's content travels in the core's `meta`, under the
//     internal key `dop.body`; here it is a field (`body`), and the `meta` that
//     remains is the AUTHOR's. Leaking an internal convention to the screen
//     creates coupling nobody can undo later.

// ADR-0009 §1's three layers. The same suffixes and the same NUMBERS as
// dop.v1.KnowledgeArtifact.Kind — the conversion between the two ends is the
// identity.
enum KnowledgeKind {
  KNOWLEDGE_KIND_UNSPECIFIED = 0;
  KNOWLEDGE_KIND_RULE        = 1;  // conventions the agent obeys
  KNOWLEDGE_KIND_INDEX       = 2;  // a map of the code
  KNOWLEDGE_KIND_MEMORY      = 3;  // findings and lessons from past demands
}

message KnowledgeArtifact {
  string        id         = 1;
  KnowledgeKind kind       = 2;
  // Empty on an account- or workspace-scoped artifact — and genuinely empty,
  // with no id invented to "fill it in".
  string        project_id = 3;
  string        name       = 4;
  int32         version    = 5;
  // An ObjectStore pointer. Filled in only on a LARGE artifact, which the
  // sandbox reads straight from storage; in that case `body` comes back empty.
  string        object_ref = 6;
  // The AUTHOR's meta. The core's internal keys (`dop.body`, `dop.scope`) do
  // not reach here: they became `body` and `scope`.
  google.protobuf.Struct meta = 7;
  // The small artifact's inline content — it saves a second round trip to the
  // server just to draw a three-line rule.
  string body  = 8;
  // account | workspace | project — the level at which the artifact holds.
  string scope = 9;
}

// What was LEFT OUT of the package, per layer.
//
// It exists because "it fitted" and "it fitted because we threw half the memory
// away" are different facts, and only the second explains an agent that ignored
// a lesson the platform had kept.
message DroppedCounts {
  int32 rules    = 1;
  int32 findings = 2;
  int32 index    = 3;
  int32 memories = 4;
  // Derived: any counter above greater than zero. It is the only field the
  // screen has to consult to say "the context was truncated".
  bool  truncated = 5;
}

// The agent's carry-on luggage for a demand (ADR-0009 §3).
message ContextPackage {
  string demand_id = 1;
  repeated string rules = 2;
  repeated KnowledgeArtifact index    = 3;
  repeated KnowledgeArtifact memories = 4;
  repeated Finding findings = 5;
  // Measured by token counting during assembly, in the core. The edge passes it
  // on; counting again here would give a second number, and two numbers
  // disagreeing about the same package is worse than none.
  int32 estimated_tokens = 6;
  // ABSENT = the core did not report the drops (see this file's header). Never
  // fill it with zeroes to "look tidy": zero is an ASSERTION that nothing was
  // dropped.
  DroppedCounts dropped = 7;
}

// Artifact + relevance, PAIRED. The core returns two parallel lists; the
// pairing is the edge's job because it is the screen that suffers from the
// misalignment.
message MemoryHit {
  KnowledgeArtifact artifact = 1;
  // `optional` on purpose: a score of 0 is "no similarity"; an absent score is
  // "the core did not score this result". The lexical search and the semantic
  // one do not answer the same thing, and the screen has to be able to say so.
  optional float score = 2;
}

service KnowledgeService {
  rpc GetContextPackage(GetContextPackageRequest) returns (ContextPackage);
  rpc SearchMemory     (SearchMemoryRequest)      returns (SearchMemoryResponse);
  rpc ReadIndex        (ReadIndexRequest)         returns (KnowledgeArtifact);
  rpc PutArtifact      (PutArtifactRequest)       returns (KnowledgeArtifact);
  rpc ListRules        (ListRulesRequest)         returns (ListRulesResponse);
}

// It takes no token budget, on purpose: the package's ceiling is cost policy
// (ADR-0011), and letting the client choose its own ceiling would turn the
// governance into a suggestion. The core decides; the edge shows the result AND
// what was dropped.
message GetContextPackageRequest { string demand_id = 1; }

message SearchMemoryRequest {
  // Empty searches the ACCOUNT-scoped memory — the one that holds for every
  // project.
  string project_id = 1;
  string query      = 2;
  // Zero = the core's default. The edge fixes no number of its own: that would
  // be two defaults for the same question.
  int32  limit      = 3;
}
message SearchMemoryResponse { repeated MemoryHit hits = 1; }

// A missing index is NOT_FOUND, not an empty list: the agent has to KNOW there
// is no map. A silently empty index lies with the same confidence as an
// out-of-date one.
message ReadIndexRequest { string project_id = 1; string repo = 2; }

// The cycle's write-back (ADR-0009 §4): today's finding is tomorrow's demand's
// context.
message PutArtifactRequest {
  KnowledgeKind kind       = 1;
  // Empty writes into the ACCOUNT's scope — a rule that holds in every project.
  string        project_id = 2;
  string        name       = 3;
  // Bytes, not a string: the content is arbitrary (markdown, JSON, a generated
  // map) and the core treats it as bytes. In the equivalent REST call it travels
  // as base64.
  bytes         content    = 4;
  google.protobuf.Struct meta = 5;

  // Every write carries an idempotency key (ADR-0017). Here it is NOT redundant
  // with a UNIQUE: rewriting the same name in the same scope is a legitimate
  // operation (it bumps the version), so without the key a network retry would
  // silently become a new version. Empty = the BFF generates one, which is what
  // REST does.
  string idempotency_key = 10;
}

message ListRulesRequest  { string project_id = 1; }
// With the account → workspace → project inheritance already resolved by the
// core.
message ListRulesResponse { repeated string rules = 1; }
