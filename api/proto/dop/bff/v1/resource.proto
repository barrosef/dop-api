syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/struct.proto";

// Resources at the EDGE: integrations, skills and shareable flows.
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// **A hard rule: the secret never appears in a response.** `SetCredential`
// writes it into the vault and the resource comes back with `credential_ref` —
// an opaque label that says there IS a credential, never which one. There is no
// RPC that reads the value, and there must not come to be one: the one that
// needs it is the executor, straight from the vault (ADR-0001).

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_INTEGRATION = 1;
  RESOURCE_KIND_SKILL       = 2;
  RESOURCE_KIND_WORKFLOW    = 3;
  RESOURCE_KIND_GIT_FLOW    = 4;
}

message Resource {
  string id      = 1;
  ResourceKind kind = 2;
  string name    = 3;
  int32  version = 4;
  // The category and the provider live here. The category is a lowercase string
  // (git | task_manager | agent): the one that rules the vocabulary is the
  // provider.
  google.protobuf.Struct config = 5;
  // Empty = an integration with no secret yet. Never the secret.
  string credential_ref = 6;
}

message Grant {
  string id          = 1;
  string resource_id = 2;
  string user_id     = 3;
  string level       = 4;  // use | manage
}

message ListResourcesRequest {
  // Empty = every kind.
  ResourceKind kind = 1;
}
message ListResourcesResponse { repeated Resource resources = 1; }

message GetResourceRequest { string id = 1; }

message CreateResourceRequest {
  ResourceKind kind = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
  string idempotency_key = 4;
}

// The secret goes in through a SEPARATE RPC, and not in CreateResource: it
// keeps the value out of the most logged and most retried request of all.
message SetCredentialRequest {
  string resource_id = 1;
  bytes  secret      = 2;
}

message GrantResourceRequest {
  string resource_id = 1;
  string user_id     = 2;
  string level       = 3;
}

message RevokeGrantRequest  { string grant_id = 1; }
message RevokeGrantResponse { bool revoked = 1; }

service ResourceService {
  rpc ListResources  (ListResourcesRequest)  returns (ListResourcesResponse);
  rpc GetResource    (GetResourceRequest)    returns (Resource);
  rpc CreateResource (CreateResourceRequest) returns (Resource);
  // It returns the RESOURCE (without the value), not the bare reference: the
  // cockpit needs to show "credential configured" without a second round trip
  // to the server.
  rpc SetCredential  (SetCredentialRequest)  returns (Resource);
  rpc GrantResource  (GrantResourceRequest)  returns (Grant);
  rpc RevokeGrant    (RevokeGrantRequest)    returns (RevokeGrantResponse);
}
