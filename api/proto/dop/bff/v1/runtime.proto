syntax = "proto3";
package dop.bff.v1;

import "dop/bff/v1/cost.proto";

// The AgentRuntime at the EDGE: running ONE conversation turn on a thread.
//
// The same discipline as identity.proto: identity comes from the token in
// `authorization: Bearer <token>`, the active account from the `x-account-id`
// metadata. There is no CallContext here.
//
// Four decisions structure this contract:
//
// 1. **ONE turn per call, not a session.** The RPC is unary and returns one
//    round's result: context → routing → model → measurement → messages →
//    finding. The loop of N turns belongs to the caller, and that is precisely
//    why the budget manages to interrupt between one round and the next — the
//    demand PAUSES (ADR-0011 §2) instead of being cut in the middle of one.
//
// 2. **There is no streaming here, on purpose.** Live following is the SSE that
//    already exists (StreamService.WatchDemand): every published message
//    becomes an event in the core (ADR-0006) and reaches the cockpit on its
//    own. A second streaming path would be a second source of truth for the
//    SAME timeline, and the two would diverge on the first reconnect.
//
// 3. **The agent provider is a per-REQUEST choice.** A provider is a resource
//    of category `agent` (ADR-0013), per account and per project — several
//    coexist in the same process. That is why `provider` is a field of the
//    request and not boot configuration. Empty = the installation's default.
//
// 4. **Absent ≠ zeroed, here more than anywhere.** Two fields of this contract
//    exist only to stop an ABSENCE of information from being read as an
//    ASSERTION of zero: `cache_creation_known` and `cost_known`. See TurnUsage
//    — it is the difference between "nothing was written to the cache" and
//    "this provider does not count that", and between "the call was free" and
//    "there is no price table". A budget fed with consolation zeroes is the
//    fiction ADR-0011 exists to prevent.

service RuntimeService {
  rpc RunTurn (RunTurnRequest) returns (TurnOutcome);
}

message RunTurnRequest {
  string demand_id = 1;
  string thread_id = 2;
  // The turn's message. It enters the thread as an event before the call to the
  // model: if the provider goes down, the conversation shows what was asked.
  string text = 3;
  // mechanical | investigation | implementation | critic — and whatever else
  // the core accepts. An OPEN vocabulary (an unknown kind falls back to the
  // expensive path and says so), hence a string and not an enum. Empty =
  // "implementation".
  string task_kind = 4;
  // Empty = the installation's default provider. See the header's decision 3.
  // Which agent integration to use. Empty = the account's only one; if there is
  // more than one, the core REFUSES with the list instead of choosing
  // (ADR-0013).
  string resource_id = 5;
  // The OPERATOR's instruction, coming from the attention box. It goes in
  // through the provider's authority channel (a `system`/`developer` message
  // AFTER the history), never as user text: it is the difference between an
  // instruction that authorizes and a text anybody can write. It also preserves
  // the cached prefix, instead of rewriting the top of the prompt
  // (ADR-0012 §1).
  string operator_note = 6;
  // 0 = the BFF's default.
  int32 max_output_tokens = 7;
  // Empty = the BFF generates one. ALL of the turn's writes derive from this
  // key (the incoming message, the truncation notice, the measurement, the
  // reply, the finding), so that resending the SAME request repeats zero
  // effects. It is the guarantee that stops consumption from counting twice —
  // and without it the budget becomes fiction.
  string idempotency_key = 10;
}

// The task → (model, effort) decision, with the WHOLE justification.
message RoutingView {
  string task_kind = 1;
  // The model's CONCRETE name at the active provider. The core decides the
  // CLASS (ADR-0011 §3); the catalogue that translates class → name is per
  // provider, and it lives on the edge's side — the same policy × catalogue
  // separation as internal/domain/cost/router.go.
  string model = 2;
  // The effort ASKED FOR (the core's vocabulary: low|medium|high|xhigh|max).
  string effort = 3;
  // The effort ACTUALLY applied. It may be lower: not every provider has all
  // five levels, and pretending it applied `max` on a critical task (ADR-0007)
  // would be hiding a product decision inside an adapter.
  string effort_applied = 4;
  // The justification with the provenance up front, whole. See cost.proto.
  string reason = 5;
  // True when the thread's BRIEF (ADR-0010 §2) beat the router: the brief is
  // that thread's frozen contract, and changing its model halfway would
  // invalidate the cached prefix of every previous turn.
  bool from_agent_card = 6;
}

message TurnUsage {
  // The four parts are DISJOINT: input does NOT include what came from the
  // cache. It is dop.v1.UsageEvent's semantics, and not every provider counts
  // that way — whoever counts inclusively is normalized in the adapter, because
  // summing their parts as if they were disjoint would silently inflate the
  // measurement.
  int64 input_tokens          = 1;
  int64 output_tokens         = 2;
  int64 cache_read_tokens     = 3;
  int64 cache_creation_tokens = 4;
  Money cost = 5;
  // FALSE = this provider does not report cache creation. The zero above is an
  // absence of information, not an assertion that nothing was written to the
  // cache.
  bool cache_creation_known = 6;
  // FALSE = there is no price table for this model. The cost above is zero for
  // want of a table, not because the call was free.
  bool cost_known = 7;
}

message FindingRef {
  string id    = 1;
  string title = 2;
}

message TurnOutcome {
  string demand_id = 1;
  string thread_id = 2;
  string provider  = 3;
  RoutingView routing = 4;
  // What the agent answered, as it was published on the thread.
  string reply = 5;
  // The ids of the published messages, in the order they entered the thread.
  repeated string message_ids = 6;
  // Concluding REQUIRES a finding (the conversation spec §1): when `concluded`
  // is true, `finding` is filled in. A conclusion with no finding is REFUSED by
  // the runtime and becomes a warning — a thread does not die in silence.
  bool concluded = 7;
  FindingRef finding = 8;
  TurnUsage usage = 9;
  // The context package came back TRUNCATED by the token budget (ADR-0012). It
  // is not only signalled here: it becomes a message on the thread, because the
  // human needs to know the answer was produced without part of the material.
  bool context_truncated = 10;
  // The budget was blown: the demand PAUSES and becomes an item for a decision
  // (ADR-0011 §2). It is NOT an error, and the turn that already ran comes back
  // whole — the reply was published and so was the finding. What does not go
  // out is the NEXT turn.
  bool paused = 11;
  // A ready-made sentence for the attention box; empty when it did not pause.
  string notice = 12;
  // The blown budgets — the numbers with which the human decides.
  reserved 13, 14;  // budgets/warnings: they lived in the BFF's runtime (ADR-0023)
  // Readable warnings: an effort downgraded by the provider, a reply cut at the
  // token limit, a conclusion refused for want of a finding, a provider with no
  // cache accounting. Empty on the happy path.
}
