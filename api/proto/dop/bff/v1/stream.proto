syntax = "proto3";
package dop.bff.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Streaming at the EDGE — the SAME stream the cockpit receives as SSE.
//
// ADR-0017 (convention 1) commands: server-side streaming for everything live,
// and the BFF converts it into SSE for the browser. The browser is ONE of the
// consumers; `dop-cli` and the sandboxes' agents speak gRPC and should not be
// forced to implement `text/event-stream` to follow the same thing. That is why
// this service exists: the same use-case function, two adapters — as in
// hierarchy.proto and identity.proto, only now with a streamed response.
//
// The same discipline as the edge's other contracts: identity does NOT travel
// in the body — it comes from the token in `authorization: Bearer <token>` and
// the active account from the `x-account-id` metadata. There is no CallContext
// here.

// StreamEvent is the core's log event (dop.v1.EventEnvelope) in the edge's
// clothes. `account` is left out because the account is already the metadata's:
// repeating it would be a second source of truth about the tenant.
message StreamEvent {
  // The event's id in the core's LOG. It is this value the SSE emits as `id:`
  // and that the client returns in `since_event_id` to resume with no gap and
  // no duplicate. Empty in the demand stream, which has no cursor (see
  // below).
  string id           = 1;
  string type         = 2;   // dop.hierarchy.project.created
  string aggregate    = 3;   // demand, project, workspace, resource...
  string aggregate_id = 4;
  google.protobuf.Struct    payload     = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message WatchEventsRequest {
  // Optional filters. Empty = everything the account produces. They exist so
  // the attention box does not have to receive (and discard) the whole log.
  repeated string aggregate = 1;
  repeated string types     = 2;

  // The resume cursor: the LAST event the client has already processed. It
  // crosses intact into the core's `since_event_id`, which drains the log from
  // there and only then splices into the live stream. In SSE the equivalent is
  // the `Last-Event-ID` header; here it is a field, because gRPC has no such
  // header.
  string since_event_id = 3;
}

// WatchDemand follows ONE demand: a thread message, a stage advancing, a
// published finding. It is what makes the demand's chat live.
message WatchDemandRequest { string demand_id = 1; }

message LogLine {
  string source  = 1;   // app | test | infra
  string service = 2;
  string line    = 3;
  google.protobuf.Timestamp at = 4;
}

// TailLogs is the sandbox's log tail. `source`, `service` and `test_type` are
// the core's filters and are passed on without interpretation.
message TailLogsRequest {
  string sandbox_id = 1;
  string source     = 2;
  string service    = 3;
  string test_type  = 4;
}

service StreamService {
  // The active account's events — it feeds the timeline and the attention box.
  rpc WatchEvents (WatchEventsRequest) returns (stream StreamEvent);
  // One demand's events. It has NO resume cursor: the core's contract
  // (dop.v1.WatchDemandRequest) offers none, and inventing an id here would be
  // promising a resume the source cannot deliver. Whoever reconnects rereads
  // the demand's dossier and resubscribes.
  rpc WatchDemand (WatchDemandRequest) returns (stream StreamEvent);
  // A sandbox's log tail. Also with no cursor, for the same reason.
  rpc TailLogs    (TailLogsRequest)    returns (stream LogLine);
}
