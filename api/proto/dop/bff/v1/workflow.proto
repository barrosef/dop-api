syntax = "proto3";
package dop.bff.v1;

// The workflow at the EDGE — the demand's cycle, resolved by the chain
// platform ◁ account ◁ workspace ◁ project ◁ demand (ADR-0014).
//
// The same discipline as identity.proto: identity does NOT travel in the body —
// it comes from the token in `authorization: Bearer <token>`, and the active
// account from the `x-account-id` metadata. There is no CallContext here.
//
// The STAGE vocabulary (StageType, ArtifactKind, Gate) lives in THIS file and
// is imported by demand.proto, exactly as dop.v1 does it. Repeating the enums
// there would be a parallel dictionary inside the same package — and it would
// not even compile.
//
// **Where the edge earns its keep here: PROVENANCE in a single shape.** The
// core returns the same facts in two ways — the `resolved_from` sentence
// ("account ◂ platform — stages: context (platform), spec (account)"), which is
// what the screen prints, and the `contributors`/`origins` fields, which is
// what can be used. The edge delivers ONE `Provenance`, assembled from the
// fields, with the whole sentence alongside in `sentence` for checking and for
// whoever only wants to print it. That way the client neither chooses between
// two sources nor decides which of the two to obey.
//
// (Until P-20 the edge assembled `Provenance` by PARSING the sentence, because
// the fields did not exist in the core's contract. They have existed since
// P-19, and the parser is gone: a contract that forces the consumer to
// interpret text breaks the day somebody improves the wording.)

// ── vocabulary shared with dop.v1 (workflow.proto) ──────────────────────────

// The stage's semantic type: it decides the renderer on the screen and the
// agent's behaviour. The same names and the same numbers as dop.v1.StageType —
// a new type requires the platform to evolve, a new composition does not
// (ADR-0014 §1).
enum StageType {
  STAGE_TYPE_UNSPECIFIED      = 0;
  STAGE_TYPE_CONTEXT          = 1;
  STAGE_TYPE_SPEC             = 2;
  STAGE_TYPE_PLAN             = 3;
  STAGE_TYPE_IMPLEMENTATION   = 4;
  STAGE_TYPE_TEST             = 5;
  STAGE_TYPE_HUMAN_VALIDATION = 6;
  STAGE_TYPE_FINALIZATION     = 7;
  STAGE_TYPE_GENERIC          = 8;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_DOCUMENT    = 1;
  ARTIFACT_KIND_SPEC        = 2;
  ARTIFACT_KIND_PLAN        = 3;
  ARTIFACT_KIND_TEST_PLAN   = 4;
  ARTIFACT_KIND_DIAGRAM     = 5;
  ARTIFACT_KIND_REPORT      = 6;
}

// The stage's gate: who closes it. GATE_HUMAN is what stops the platform from
// approving on a person's behalf (ADR-0014, and the core refuses an agent in
// DecideGate).
enum Gate {
  GATE_UNSPECIFIED = 0;
  GATE_NONE        = 1;
  GATE_HUMAN       = 2;
}

// ── the edge's models ───────────────────────────────────────────────────────

message StageSpec {
  string    key  = 1;
  string    name = 2;   // free text, the author's
  StageType type = 3;
  repeated ArtifactKind artifacts = 4;
  Gate      gate = 5;
  // E.g.: test → aaa, e2e, integration. Dynamic: the one who composes them is
  // the author.
  repeated string subtypes = 6;
}

message Flow {
  string id      = 1;
  string name    = 2;
  string description = 3;
  int32  version = 4;
  // The owning level in the chain: platform | account | workspace | project |
  // demand. A string, and not an enum, because in dop.v1 it is a string too: an
  // enum only at the edge would be the parallel dictionary this contract exists
  // not to have.
  string owner_scope = 5;
  string owner_id    = 6;
  repeated StageSpec stages = 7;
}

// Where ONE stage came from — the answer to "why did the demand follow this
// flow".
message StageOrigin {
  string stage_key = 1;
  // The same vocabulary as `Flow.owner_scope` (platform | account | …), and not
  // the labels of the core's sentence: the edge normalizes so the client can
  // compare against `owner_scope` with no translation table of its own.
  string scope     = 2;
}

// The provenance trail, structured.
message Provenance {
  // The levels that actually declared something, from the MOST SPECIFIC to the
  // most generic — the same order in which the sentence reads. A level that
  // inherited by omission does not appear, because it contributed nothing.
  repeated string contributors = 1;
  // The origin stage by stage, in the SAME ORDER as `flow.stages`: when the
  // core did not truncate, `origins[i]` is the origin of `flow.stages[i]`.
  repeated StageOrigin origins = 2;
  // The core's sentence, preserved whole. It is what the screen prints today
  // and what allows the structured reading above to be checked.
  string sentence  = 3;
  // True when `origins` does NOT cover every stage of `flow.stages` — that is,
  // there is a stage whose origin the edge cannot report. Saying so is
  // different from letting the client conclude the rest have no origin.
  //
  // Measured by comparing the two lengths, and not deduced from a "…" at the
  // end of the sentence: the core's 12-stage cut is of the SENTENCE, and the
  // structured list comes whole. Against a current core this is always false;
  // it keeps existing because the promise is about the list, not about today's
  // cut.
  bool   truncated = 4;
}

message EffectiveFlow {
  Flow       flow       = 1;
  Provenance provenance = 2;
}

// ── requests ────────────────────────────────────────────────────────────────

message ListFlowsRequest {
  // Empty = every flow visible in the active account.
  string owner_scope = 1;
  string owner_id    = 2;
}
message ListFlowsResponse { repeated Flow flows = 1; }

message GetFlowRequest { string id = 1; }

// The flow goes in whole: v1 has no per-stage editing, and sending half a flow
// would be a partial replacement in disguise (the same trap as UpdateProject).
message CreateFlowRequest {
  Flow   flow            = 1;
  string idempotency_key = 2;
}

// UpdateFlow in the core produces a NEW VERSION — the past is not rewritten,
// because demands under way froze the version they were following
// (ADR-0014 §4).
message UpdateFlowRequest { string id = 1; Flow flow = 2; }

// A dry run: it returns the report, not an error. The screen needs the list to
// mark the problematic stages, not a message for a toast.
message ValidateFlowRequest  { Flow flow = 1; }
message ValidateFlowResponse {
  bool valid = 1;
  repeated string errors   = 2;
  repeated string warnings = 3;  // e.g.: a flow with no spec stage
}

message ResolveFlowRequest {
  // The level the question is asked from: platform | account | workspace |
  // project | demand.
  string scope    = 1;
  string scope_id = 2;
}

message PromoteFlowRequest {
  string flow_id      = 1;
  string target_scope = 2;
  string target_id    = 3;
}

service WorkflowService {
  rpc ListFlows    (ListFlowsRequest)    returns (ListFlowsResponse);
  rpc GetFlow      (GetFlowRequest)      returns (Flow);
  rpc CreateFlow   (CreateFlowRequest)   returns (Flow);
  rpc UpdateFlow   (UpdateFlowRequest)   returns (Flow);
  rpc ValidateFlow (ValidateFlowRequest) returns (ValidateFlowResponse);
  // The effective flow AND the trail of how it was reached, already structured.
  rpc ResolveFlow  (ResolveFlowRequest)  returns (EffectiveFlow);
  rpc PromoteFlow  (PromoteFlowRequest)  returns (Flow);
}
