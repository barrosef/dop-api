[project]
name = "dop-api"
version = "0.1.0"
description = "BFF da plataforma DOP — REST+SSE para o app, gRPC para CLI e sandbox"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "structlog>=25.1",
    "grpcio>=1.83",
    "grpcio-tools>=1.83",
    "protobuf>=6.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sse-starlette>=2.2",
    "grpcio-reflection>=1.83.1",
    "pyjwt[crypto]>=2.13.0",
    # SDK do provedor de agente Anthropic — usado SÓ pelo adaptador
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Código gerado por protoc não se revisa nem se formata — regenera-se.
# Vale para as duas gerações: os stubs do núcleo e os do contrato da borda.
extend-exclude = ["app/coreclient/gen", "app/grpcapi/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
